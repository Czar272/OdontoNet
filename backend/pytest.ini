[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
# Categorías de pruebas (ver docs/DEVELOPMENT.md). Cada prueba debe tener al menos una.
markers =
    auth: login, tokens, /auth/me y usuarios inactivos
    patients: endpoints y validación de pacientes
    doctors: endpoints de doctores
    users: gestión de usuarios por administración (/users, /auth/register)
    api: contrato de la API (OpenAPI, /health, formato de errores)
    seed: seed sintético de desarrollo
    isolation: aislamiento entre clínicas
    rbac: permisos por rol
