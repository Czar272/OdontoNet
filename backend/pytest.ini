[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
# Categorías de pruebas (ver docs/DEVELOPMENT.md). Cada prueba debe tener al menos una.
markers =
    auth: login, tokens, /auth/me y usuarios inactivos
    patients: endpoints y validación de pacientes
    doctors: endpoints de doctores
    users: gestión de usuarios por administración (/users, /auth/register)
    api: contrato de la API (OpenAPI, /health, formato de errores)
    seed: seed sintético de desarrollo
    isolation: aislamiento entre clínicas
    rbac: permisos por rol
    appointments: citas y agenda
    records: expediente clínico (historia médica, consultas, tratamientos, historial cronológico)
    images: imágenes clínicas (almacenamiento privado, archivos, verificación de respaldos)
    periodontal: periodontograma manual (modelo, validación, borradores, finalización, aislamiento)
    dashboard: panel de inicio y reportes (indicadores, periodo, filtro por doctor, agenda de hoy, series agrupadas, CSV)
    migrations: cadena completa de migraciones Alembic sobre una base temporal vacía
# Avisos conocidos de dependencias de terceros, no del código de OdontoNet.
# Se quitan al actualizar FastAPI/Starlette (deuda en docs/PROJECT_STATUS.md).
filterwarnings =
    ignore:The 'app' shortcut is now deprecated:DeprecationWarning
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
