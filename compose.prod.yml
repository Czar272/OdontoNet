# Despliegue de producción (ODON-238). Guía en docs/DEPLOYMENT.md.
name: odontonet-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16.14
    container_name: ${ODONTONET_DB_CONTAINER:-odontonet-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requerido}
    # Solo este equipo, para las herramientas de respaldo. Nunca en la red.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: odontonet-api:local
    restart: unless-stopped
    env_file:
      - ${ODONTONET_API_ENV_FILE:-backend/.env}
    # Dentro del contenedor, la base y las imágenes tienen otra ruta que en el equipo.
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      IMAGE_STORAGE_DIR: /data/images
    volumes:
      - ${ODONTONET_IMAGE_DIR:?ODONTONET_IMAGE_DIR requerido}:/data/images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health', headers={'Host': '${ODONTONET_DOMAIN:?ODONTONET_DOMAIN requerido}'}), timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    image: odontonet-proxy:local
    restart: unless-stopped
    environment:
      ODONTONET_DOMAIN: ${ODONTONET_DOMAIN:?ODONTONET_DOMAIN requerido}
    ports:
      - "${ODONTONET_HTTP_PORT:-80}:80"
      - "${ODONTONET_HTTPS_PORT:-443}:443"
    volumes:
      # La CA interna vive aquí: si se pierde, hay que reinstalarla en cada equipo.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
